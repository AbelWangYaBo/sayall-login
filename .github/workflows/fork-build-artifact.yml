name: Fork build artifact

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布 GitHub Release + appcast（供 app 自动更新）'
        type: boolean
        default: false
  push:
    branches: ['feature/**', 'fork/**']

permissions:
  contents: read

jobs:
  build:
    name: Build SayAll.app (ad-hoc)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_FEED_URL: "https://github.com/AbelWangYaBo/sayall-login/releases/latest/download/appcast.xml"
      SAYALL_PRIVATE_PLATFORM_MODE: public
      SAYALL_ENABLE_PRIVATE_SWIFTPM: "0"
      SAYALL_PRIVATE_PLATFORM_PACKAGE_PATH: ""
      SAYALL_ENABLE_SIRI_REMOTE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and package SayAll.app
        env:
          CODE_SIGN_IDENTITY: "-"
          REQUIRE_SIRI_REMOTE_SIGNING: "0"
          REQUIRE_DEVELOPER_ID_SIGNING: "0"
          RELEASE_SWIFT_BUILD_TIMEOUT_SECONDS: "3600"
          RELEASE_CODESIGN_TIMEOUT_SECONDS: "120"
          RELEASE_STAGE_TIMEOUTS: "1"
        run: scripts/build-app.sh

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent SayAll.app SayAll-arm64.zip
          shasum -a 256 SayAll-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayAll-app-arm64
          path: dist/SayAll-arm64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release + appcast
    if: ${{ github.event.inputs.publish_release == 'true' }}
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: SayAll-app-arm64

      - name: Fetch Sparkle signing tools
        run: |
          curl -sL -o /tmp/sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz
          mkdir -p /tmp/sparkle-bin
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle-bin bin

      - name: Read version from built app
        id: ver
        run: |
          ditto -x -k SayAll-arm64.zip ./unpacked
          PLIST=./unpacked/SayAll.app/Contents/Info.plist
          echo "build=$(plutil -extract CFBundleVersion raw -o - "$PLIST")" >> "$GITHUB_OUTPUT"
          echo "short=$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")" >> "$GITHUB_OUTPUT"

      - name: Create release with signed appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          TAG="v${{ steps.ver.outputs.build }}"
          echo "${SPARKLE_EDDSA_KEY}" > "$RUNNER_TEMP/eddsa.priv"
          chmod 600 "$RUNNER_TEMP/eddsa.priv"
          mkdir -p appcast_dir
          cp SayAll-arm64.zip appcast_dir/
          /tmp/sparkle-bin/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/eddsa.priv" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            appcast_dir
          gh release create "$TAG" SayAll-arm64.zip \
            --repo "${{ github.repository }}" \
            --title "SayAll ${{ steps.ver.outputs.short }} (build ${{ steps.ver.outputs.build }})" \
            --notes "自动化构建（ad-hoc 签名）。首次安装请右键打开或 xattr -cr。"
          gh release upload "$TAG" appcast_dir/appcast.xml --repo "${{ github.repository }}" --clobber
